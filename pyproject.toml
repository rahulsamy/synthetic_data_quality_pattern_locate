[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rahulsamy-synthetic_data_quality_pattern_locate"
version = "0.1.0"
description = "用一组明示的正则规则扫描输入，报告大模型推理优化工程师·合成数据的质量分水岭相关的命中行与片段"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "rahulsamy" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://rahulsamy.github.io"
Repository = "https://github.com/rahulsamy/synthetic_data_quality_pattern_locate"
Issues = "https://github.com/rahulsamy/synthetic_data_quality_pattern_locate/issues"

[project.scripts]
synthetic_data_quality_pattern_locate = "synthetic_data_quality_pattern_locate:main"

[tool.setuptools]
py-modules = ["synthetic_data_quality_pattern_locate"]
